name: HSI triple-kernel finite correspondence
on:
  pull_request:
    paths:
      - 'pleiadian_blue/cross_kernel.py'
      - 'pleiadian_blue/test_cross_kernel.py'
      - '.github/workflows/uvcm_cross_kernel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bounded triple semantic correspondence
        run: python3 -m unittest discover -s pleiadian_blue -p 'test_cross_kernel.py' -v
      - name: Independent finite cross-kernel sweep
        run: python3 -m pleiadian_blue.cross_kernel
