name: hsi_search

on:
  push:
    branches: [main]
    paths:
      - "hsi-net.sh"
      - "hsi-net.ps1"
      - "hsi_net.py"
      - "hsi-search.sh"
      - "hsi_search.py"
      - "HSI_NET_SINGULARITY.md"
      - "HSI_SEARCH.md"
      - ".github/workflows/hsi_search.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and HSI NET model
        run: |
          set -eu
          sh -n hsi-net.sh
          sh -n hsi-search.sh
          python3 -m py_compile hsi_net.py hsi_search.py
          python3 hsi_net.py --list-adapters >/tmp/net.json
          python3 - <<'PY'
          import json
          r=json.loads(open("/tmp/net.json").read())
          assert r["protocol"]=="HSI-NET-SINGULARITY/1.0"
          assert r["model"]=="ABSTRACT_GLOBAL_INFORMATION_FIELD"
          assert r["adapters"]["openverse_audio"]["status"]=="ACTIVE"
          assert r["adapters"]["openverse_audio"]["exhaustive"] is False
          PY
      - name: Mock source
        run: |
          cat >/tmp/mock_search.py <<'PY'
          import json,urllib.parse
          from http.server import BaseHTTPRequestHandler,HTTPServer
          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def do_GET(self):
                  u=urllib.parse.urlparse(self.path)
                  if u.path!="/v1/audio/":
                      self.send_response(404);self.end_headers();return
                  q=urllib.parse.parse_qs(u.query)
                  if "source" in q:
                      assert q["source"]==["freesound"]
                  base="http://127.0.0.1:8877/"
                  rows=[
                    {"id":"ok-cc0","title":"ok","creator":"A","license":"cc0","license_version":"1.0","url":base+"a.wav","foreign_landing_url":"https://example.test/a","provider":"freesound","source":"freesound","filetype":"wav","category":"music"},
                    {"id":"ok-alt","title":"alt wav","creator":"C","license":"pdm","license_version":"1.0","url":base+"c.mp3","foreign_landing_url":"https://example.test/c","provider":"freesound","source":"freesound","filetype":"mp3","category":"sound_effect","alt_files":[{"url":base+"c.wav","filetype":"wav","filesize":1234,"sample_rate":16000}]},
                    {"id":"reject-by","title":"reject","creator":"B","license":"by","license_version":"4.0","url":base+"b.wav","foreign_landing_url":"https://example.test/b","provider":"freesound","source":"freesound","filetype":"wav","category":"music"},
                    {"id":"reject-speech","title":"LL-Q1860-test-sky blue","creator":"Speaker","creator_url":"https://lingualibre.org/wiki/Q1","license":"cc0","license_version":"1.0","url":base+"a.wav","foreign_landing_url":"https://example.test/speech","provider":"wikimedia_audio","source":"wikimedia_audio","filetype":"wav","category":"pronunciation"}
                  ]
                  raw=json.dumps({"results":rows}).encode()
                  self.send_response(200);self.send_header("Content-Type","application/json")
                  self.send_header("Content-Length",str(len(raw)));self.end_headers();self.wfile.write(raw)
          HTTPServer(("127.0.0.1",8877),H).serve_forever()
          PY
          python3 /tmp/mock_search.py >/tmp/mock-search.log 2>&1 &
          echo $! >/tmp/mock-search.pid
          for i in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:8877/v1/audio/?q=x&page_size=5' >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: FOUND projection and local admission
        run: |
          set -eu
          HSI_OPENVERSE_BASE=http://127.0.0.1:8877/v1/audio/           python3 hsi_search.py --license cc0,pdm --extension wav             --category music,sound_effect --prefer-source freesound             --max-results 2 --max-calls 6 --retries 1 "Blue Stars" >/tmp/search.out
          python3 - <<'PY'
          import json
          r=json.loads(open("/tmp/search.out").read().strip().splitlines()[-1])
          assert r["protocol"]=="HSI-SEARCH/1.0" and r["version"]=="1.3.0"
          assert r["status"]=="FOUND"
          assert r["net_protocol"]=="HSI-NET-SINGULARITY/1.0"
          n=r["net_projection"]
          assert n["model"]=="ABSTRACT_GLOBAL_INFORMATION_FIELD"
          assert n["finite_projection"] is True
          assert n["global_exhaustion_claim"] is False
          assert n["epistemic_invariants"]["adapter_scope_is_not_internet_totality"] is True
          assert n["epistemic_invariants"]["budget_exhaustion_is_not_global_exhaustion"] is True
          assert r["blue"]["semantic_non_coercion"] is True
          assert r["epistemic_rule"]=="absence_of_retrieval_is_not_evidence_of_nonexistence"
          ids={x["record_uid"]:x for x in r["results"]}
          assert "ok-cc0" in ids and "ok-alt" in ids
          assert ids["ok-alt"]["filetype"]=="wav"
          assert ids["ok-alt"]["selected_media_variant"]=="alt_file"
          assert ids["ok-alt"]["media_url"].endswith("/c.wav")
          assert all(x["record_uid"]!="reject-by" for x in r["results"])
          assert r["search_uid"].isdigit() and r["search_certificate_uid"].isdigit()
          PY
      - name: SOURCE_UNAVAILABLE is not NOT_EXISTS
        run: |
          set +e
          HSI_OPENVERSE_BASE=http://127.0.0.1:9/v1/audio/           python3 hsi_search.py --license cc0,pdm --extension wav             --category music,sound_effect --max-calls 1 --retries 1 --timeout 5             "missing source" >/tmp/unavailable.out
          code=$?
          set -e
          test "$code" -eq 3
          python3 - <<'PY'
          import json
          r=json.loads(open("/tmp/unavailable.out").read().strip().splitlines()[-1])
          assert r["status"] in ("SOURCE_UNAVAILABLE","EXHAUSTED_BUDGET")
          assert "NOT_EXISTS" not in json.dumps(r)
          assert r["net_projection"]["global_exhaustion_claim"] is False
          PY
