name: hsi_search

on:
  push:
    branches: [main]
    paths:
      - "hsi-search.sh"
      - "hsi_search.py"
      - "HSI_SEARCH.md"
      - ".github/workflows/hsi_search.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          set -eu
          sh -n hsi-search.sh
          python3 -m py_compile hsi_search.py
      - name: Mock source
        run: |
          cat >/tmp/mock_search.py <<'PY'
          import json,urllib.parse
          from http.server import BaseHTTPRequestHandler,HTTPServer
          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def do_GET(self):
                  u=urllib.parse.urlparse(self.path)
                  if u.path!="/v1/audio/":
                      self.send_response(404);self.end_headers();return
                  q=urllib.parse.parse_qs(u.query)
                  base="http://127.0.0.1:8877/"
                  rows=[
                    {"id":"ok-cc0","title":"ok","creator":"A","license":"cc0","license_version":"1.0","url":base+"a.wav","foreign_landing_url":"https://example.test/a","provider":"mock","source":"mock","filetype":"wav"},
                    {"id":"reject-by","title":"reject","creator":"B","license":"by","license_version":"4.0","url":base+"b.wav","foreign_landing_url":"https://example.test/b","provider":"mock","source":"mock","filetype":"wav"}
                  ]
                  raw=json.dumps({"results":rows}).encode()
                  self.send_response(200);self.send_header("Content-Type","application/json")
                  self.send_header("Content-Length",str(len(raw)));self.end_headers();self.wfile.write(raw)
          HTTPServer(("127.0.0.1",8877),H).serve_forever()
          PY
          python3 /tmp/mock_search.py >/tmp/mock-search.log 2>&1 &
          echo $! >/tmp/mock-search.pid
          for i in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:8877/v1/audio/?q=x&page_size=5' >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: FOUND and local admission
        run: |
          set -eu
          HSI_OPENVERSE_BASE=http://127.0.0.1:8877/v1/audio/           python3 hsi_search.py --license cc0,pdm --extension wav --max-results 2 --max-calls 4 --retries 1 "Blue Stars" >/tmp/search.out
          python3 - <<'PY'
          import json
          line=open("/tmp/search.out").read().strip().splitlines()[-1]
          r=json.loads(line)
          assert r["protocol"]=="HSI-SEARCH/1.0"
          assert r["status"]=="FOUND"
          assert r["blue"]["semantic_non_coercion"] is True
          assert r["blue"]["search_expands_evidence_only"] is True
          assert r["epistemic_rule"]=="absence_of_retrieval_is_not_evidence_of_nonexistence"
          assert any(x["record_uid"]=="ok-cc0" for x in r["results"])
          assert all(x["record_uid"]!="reject-by" for x in r["results"])
          assert any(x["record_uid"]=="reject-by" for x in r["rejected"])
          assert r["search_uid"].isdigit() and r["search_certificate_uid"].isdigit()
          PY
      - name: SOURCE_UNAVAILABLE is not NOT_EXISTS
        run: |
          set +e
          HSI_OPENVERSE_BASE=http://127.0.0.1:9/v1/audio/           python3 hsi_search.py --license cc0,pdm --extension wav --max-calls 1 --retries 1 --timeout 5 "missing source" >/tmp/unavailable.out
          code=$?
          set -e
          test "$code" -eq 3
          python3 - <<'PY'
          import json
          r=json.loads(open("/tmp/unavailable.out").read().strip().splitlines()[-1])
          assert r["status"] in ("SOURCE_UNAVAILABLE","EXHAUSTED_BUDGET")
          assert "NOT_EXISTS" not in json.dumps(r)
          PY
