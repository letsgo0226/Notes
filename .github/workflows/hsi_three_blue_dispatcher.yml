name: hsi_three_blue_dispatcher

on:
  push:
    branches: [main]
    paths:
      - "hsi-three.sh"
      - "hsi-solve.sh"
      - "hsi_solve.py"
      - "hsi_solve_domains.json"
      - "HSI_THREE_SYSTEM_BLUE.md"
      - ".github/workflows/hsi_three_blue_dispatcher.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SOLVE-backed dispatcher
        run: |
          set -eu
          sh -n hsi-three.sh
          grep -q 'hsi-solve.sh' hsi-three.sh
          grep -q 'SELF|UTM|TRADER_42|OMEGA|ALL' hsi-three.sh
          rm -rf /tmp/hsi-three-self
          HSI_SOLVE_OUT=/tmp/hsi-three-self sh hsi-three.sh SELF
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path("/tmp/hsi-three-self/solve.hsicert").read_text())
          assert c["protocol"]=="HSI-SOLVE/1.0"
          assert c["verification_closed"] is True
          assert c["solution_status"]["SELF"]=="COMMITTED"
          assert c["problem_totality_claim"] is False
          PY
