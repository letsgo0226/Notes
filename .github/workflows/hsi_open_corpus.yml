name: hsi_open_corpus

on:
  push:
    branches: [main]
    paths:
      - "hsi-corpus.sh"
      - "hsi-corpus.ps1"
      - "hsi_open_corpus.py"
      - "hsi_corpus_clxy_gate.py"
      - "hsi_corpus_autoevolve.py"
      - "hsi_render_policy.json"
      - "hsi_xy_analytic_2k/**"
      - "hsi_search.py"
      - "hsi_net.py"
      - "HSI_OPEN_CORPUS.md"
      - ".github/workflows/hsi_open_corpus.yml"
  pull_request:
    paths:
      - "hsi-corpus.sh"
      - "hsi-corpus.ps1"
      - "hsi_open_corpus.py"
      - "hsi_corpus_clxy_gate.py"
      - "hsi_corpus_autoevolve.py"
      - "hsi_render_policy.json"
      - "hsi_xy_analytic_2k/**"
      - "hsi_search.py"
      - "hsi_net.py"
      - "HSI_OPEN_CORPUS.md"
      - ".github/workflows/hsi_open_corpus.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and non-AI invariants
        run: |
          set -eu
          sh -n hsi-corpus.sh
          python3 -m py_compile hsi_net.py hsi_search.py hsi_open_corpus.py hsi_corpus_clxy_gate.py hsi_corpus_autoevolve.py
          grep -q 'ai_model":False' hsi_open_corpus.py
          grep -q 'neural_renderer":False' hsi_open_corpus.py
          grep -q 'machine_learning":False' hsi_open_corpus.py
          grep -q 'youtube_audio_used":False' hsi_open_corpus.py
          ! grep -Eiq 'torch|tensorflow|transformers|diffusion|openai|suno|runway|fal.ai' hsi_open_corpus.py
          grep -q 'source="network_audio"' hsi_open_corpus.py
          test -s hsi_render_policy.json
          grep -q 'hsi_bootstrap.py' hsi-corpus.sh
          grep -q 'hsi_bootstrap.py' hsi-corpus.ps1
          grep -q 'wikimedia_commons_audio' hsi_search.py

      - name: CL-XY microkernel regression tests
        run: |
          set -eu
          python3 -m unittest discover -s hsi_xy_analytic_2k -p 'test_*.py' -q

      - name: Version mismatch fails closed
        run: |
          set -eu
          rm -rf /tmp/hsi-version-mismatch
          mkdir -p /tmp/hsi-version-mismatch
          cp hsi_open_corpus.py /tmp/hsi-version-mismatch/
          cat >/tmp/hsi-version-mismatch/hsi_search.py <<'PY'
          VERSION="1.0.0"
          def run_search(*a,**k):
              return {"status":"FOUND","results":[]}
          PY
          set +e
          (cd /tmp/hsi-version-mismatch && python3 hsi_open_corpus.py "x") >/tmp/version.out 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "requires HSI-SEARCH >= 1.4.0" /tmp/version.out

      - name: Immutable Notes bundle verification
        run: |
          python3 -c 'import hashlib,json,pathlib; root=pathlib.Path("."); lock=json.loads((root/"hsi_bundle.lock.json").read_text()); assert all(hashlib.sha256((root/r["path"]).read_bytes()).hexdigest()==r["sha256"] for r in lock["files"])'
          grep -q 'commit = meta' hsi_bootstrap.py
          grep -q 'bundle verification failed' hsi_bootstrap.py

      - name: Start mock HSI NET audio sources
        run: |
          cat >/tmp/mock_audio.py <<'PY'
          import io,json,math,struct,urllib.parse,wave
          from http.server import BaseHTTPRequestHandler,HTTPServer

          def tone(freq,seconds=5,sr=16000):
              b=io.BytesIO()
              with wave.open(b,"wb") as w:
                  w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr)
                  frames=[struct.pack("<h",int(10000*math.sin(2*math.pi*freq*i/sr))) for i in range(int(seconds*sr))]
                  w.writeframes(b"".join(frames))
              return b.getvalue()
          WAVS={"a":tone(220),"b":tone(330),"c":tone(440)}

          class H(BaseHTTPRequestHandler):
              def log_message(self,*a):pass
              def send(self,raw,ctype="application/json",code=200):
                  if not isinstance(raw,bytes):raw=json.dumps(raw).encode()
                  self.send_response(code);self.send_header("Content-Type",ctype)
                  self.send_header("Content-Length",str(len(raw)));self.end_headers();self.wfile.write(raw)
              def do_GET(self):
                  u=urllib.parse.urlparse(self.path)
                  base="http://127.0.0.1:8765/"
                  if u.path=="/v1/audio/":
                      rows=[
                        {"id":"ov-alt","title":"ambient sound","creator":"Alpha","license":"pdm","license_version":"1.0",
                         "url":base+"audio/a.mp3","foreign_landing_url":"https://example.test/a","provider":"freesound","source":"freesound",
                         "filetype":"mp3","category":"sound_effect",
                         "alt_files":[{"url":base+"audio/a.wav","filetype":"wav","filesize":160044,"sample_rate":16000}]},
                        {"id":"reject-by","title":"music","creator":"Other","license":"by","license_version":"4.0",
                         "url":base+"audio/b.wav","foreign_landing_url":"https://example.test/reject","provider":"jamendo","source":"jamendo",
                         "filetype":"wav","category":"music"},
                        {"id":"reject-pronunciation","title":"LL-Q1860-test-sky blue","creator":"Speaker","creator_url":"https://lingualibre.org/wiki/Q1",
                         "license":"cc0","license_version":"1.0","url":base+"audio/c.wav","foreign_landing_url":"https://example.test/pronunciation",
                         "provider":"wikimedia_audio","source":"wikimedia_audio","filetype":"wav","category":"pronunciation"}
                      ]
                      return self.send({"results":rows})
                  if u.path=="/w/api.php":
                      pages=[
                        {"pageid":201,"title":"File:Blue piano music.wav","imageinfo":[{
                          "url":base+"audio/b.wav","descriptionurl":"https://commons.wikimedia.org/wiki/File:Blue_piano_music.wav",
                          "mime":"audio/wav","size":31098656,
                          "extmetadata":{
                            "LicenseShortName":{"value":"CC0"},
                            "LicenseUrl":{"value":"https://creativecommons.org/publicdomain/zero/1.0/"},
                            "Artist":{"value":"Commons Artist"},
                            "Categories":{"value":"Music|Piano music"},
                            "ImageDescription":{"value":"instrumental piano music"}
                          }}]},
                        {"pageid":202,"title":"File:Stars field recording.wav","imageinfo":[{
                          "url":base+"audio/c.wav","descriptionurl":"https://commons.wikimedia.org/wiki/File:Stars_field_recording.wav",
                          "mime":"audio/wav","size":160044,
                          "extmetadata":{
                            "LicenseShortName":{"value":"Public domain"},
                            "Artist":{"value":"Commons Recorder"},
                            "Categories":{"value":"Field recording|Sound effects"},
                            "ImageDescription":{"value":"ambient sound effect"}
                          }}]},
                        {"pageid":203,"title":"File:LL-test-pronunciation.wav","imageinfo":[{
                          "url":base+"audio/a.wav","descriptionurl":"https://commons.wikimedia.org/wiki/File:LL-test-pronunciation.wav",
                          "mime":"audio/wav","size":160044,
                          "extmetadata":{
                            "LicenseShortName":{"value":"CC0"},
                            "Artist":{"value":"Lingua Libre Speaker"},
                            "Categories":{"value":"Pronunciation"},
                            "ImageDescription":{"value":"pronunciation recording"}
                          }}]}
                      ]
                      return self.send({"query":{"pages":pages}})
                  if u.path.startswith("/audio/"):
                      k=u.path.rsplit("/",1)[-1].split(".")[0]
                      if k in WAVS:return self.send(WAVS[k],"audio/wav")
                  self.send({"detail":"not found"},code=404)
          HTTPServer(("127.0.0.1",8765),H).serve_forever()
          PY
          python3 /tmp/mock_audio.py >/tmp/mock-audio.log 2>&1 &
          echo $! >/tmp/mock-audio.pid
          for i in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:8765/v1/audio/?q=x&page_size=10' >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Network projection and render
        run: |
          set -eu
          rm -rf /tmp/hsi-corpus-a /tmp/hsi-corpus-cache
          HSI_OPENVERSE_BASE=http://127.0.0.1:8765/v1/audio/ \
          HSI_WIKIMEDIA_COMMONS_BASE=http://127.0.0.1:8765/w/api.php \
          HSI_CORPUS_CACHE=/tmp/hsi-corpus-cache \
          HSI_CORPUS_SR=16000 \
          HSI_CORPUS_ITEMS=3 \
          HSI_RC_MAX_CANDIDATES=8 \
          HSI_OUT=/tmp/hsi-corpus-a \
          python3 hsi_open_corpus.py "Blue Stars"

          python3 - <<'PY'
          import json,wave
          from pathlib import Path
          p=Path("/tmp/hsi-corpus-a")
          c=json.loads((p/"song.hsicert").read_text())
          l=json.loads((p/"corpus.lock.json").read_text())
          sh=json.loads((p/"search.hsicert").read_text())
          assert c["protocol"]=="HSI-OPEN-CORPUS/1.0"
          assert c["version"]=="1.9.1"
          assert c["hsi_search_version"]=="1.4.0"
          assert c["minimum_hsi_search_version"]=="1.4.0"
          assert c["closed"]==1 and c["technical_closed"]==1
          assert c["correspondence_closed"]==1
          assert c["correspondence"]["protocol"]=="HSI-RC/1.0"
          assert c["render_policy_uid"]==c["correspondence"]["render_policy_uid"]
          assert c["render_policy"]["event_boost"]>=0
          assert c["correspondence"]["sigma"]=="1/2"
          assert c["correspondence"]["residual"]==0
          assert (p/"correspondence.hsicert").exists()
          assert c["rights_closed"]==0
          assert c["ai_model"] is False and c["neural_renderer"] is False and c["machine_learning"] is False
          assert c["search_status"]=="FOUND"
          assert sh["source"]=="network_audio"
          assert sh["version"]=="1.4.0"
          assert sh["net_projection"]["adapters"]==["openverse_audio","wikimedia_commons_audio"]
          assert sh["net_projection"]["finite_projection"] is True
          assert sh["net_projection"]["global_exhaustion_claim"] is False
          assert sh["net_projection"]["epistemic_invariants"]["adapter_scope_is_not_internet_totality"] is True
          adapters={x["adapter"]:x for x in sh["net_projection"]["observations"]}
          assert adapters["openverse_audio"]["accepted"]>=1
          assert adapters["wikimedia_commons_audio"]["accepted"]>=1
          assert c["source_count"]>=2 and c["event_count"]>=5
          assert all(x["license"] in ("cc0","pdm") for x in c["sources"])
          assert all(x["category"] in ("music","sound_effect") for x in c["sources"])
          assert c["checks"]["no_lexical_pronunciation_sources"] is True
          assert c["checks"]["all_music_or_sound_effect"] is True
          assert any(x.get("selected_media_variant")=="alt_file" for x in c["sources"])
          assert any(str(x.get("openverse_id","")).startswith("commons:") for x in c["sources"])
          commons=[x for x in c["sources"] if str(x.get("openverse_id","")).startswith("commons:")]
          assert commons
          assert any(x.get("partial_source") is True for x in commons)
          assert any(x.get("raw_scope")=="downloaded_prefix" for x in commons)
          assert any((x.get("source_total_bytes") or 0)>x.get("downloaded_bytes",0) for x in commons)
          assert c["large_wav_policy"]=="finite_prefix_up_to_HSI_CORPUS_MAX_BYTES"
          assert c["max_download_bytes_per_source"]>0
          assert l["search_certificate"]["net_projection"]["projection_uid"]==c["net_projection_uid"]
          with wave.open(str(p/"song.wav"),"rb") as w:
              assert w.getnchannels()==2 and w.getsampwidth()==2 and w.getframerate()==16000
          def d257(n):
              out=bytearray()
              while n>1:
                  n,r=divmod(n,257);out.append(r-1)
              out.reverse();return bytes(out)
          blocks=json.loads((p/"song.e257").read_text())
          assert b"".join(d257(x) for x in blocks)==(p/"song.wav").read_bytes()
          PY

      - name: Endogenous CL-XY deployment and actual WAV correspondence gate
        run: |
          set -eu
          python3 hsi_corpus_clxy_gate.py --artifact /tmp/hsi-corpus-a
          python3 - <<'PY'
          import json, shutil, subprocess, sys, tempfile
          from pathlib import Path
          out=Path("/tmp/hsi-corpus-a")
          proof=json.loads((out/"deployment.clxycert").read_text())
          assert proof["protocol"]=="HSI-CORPUS-DEPLOY-CLXY/1.0"
          assert proof["closed"]==1 and proof["status"]=="VERIFIED"
          assert proof["clxy"]["step_D0"]==0 and proof["clxy"]["step_D1_num"]==0
          assert proof["clxy"]["evolve_D0"]==0 and proof["clxy"]["evolve_D1_num"]==0
          assert proof["clxy"]["bad_step_rejected"] is True
          assert proof["clxy"]["bad_evolve_rejected"] is True
          with tempfile.TemporaryDirectory() as td:
              tampered=Path(td)
              for name in ("song.wav","song.hsicert","correspondence.hsicert","manifest.json"):
                  shutil.copy2(out/name,tampered/name)
              wav=tampered/"song.wav"
              with wav.open("r+b") as f:
                  f.seek(-4,2); b=f.read(1); f.seek(-1,1); f.write(bytes([b[0]^1]))
              fail=subprocess.run([sys.executable,"hsi_corpus_clxy_gate.py","--artifact",str(tampered)],
                                  capture_output=True,text=True)
              assert fail.returncode==3, fail.stdout+fail.stderr
          PY

      - name: Endogenous renderer proposal search using real WAV output
        run: |
          set -eu
          HSI_CORPUS_CACHE=/tmp/hsi-corpus-cache \
          HSI_CORPUS_SR=16000 \
          HSI_RC_MAX_CANDIDATES=1 \
          python3 hsi_corpus_autoevolve.py \
            --baseline /tmp/hsi-corpus-a \
            --lock /tmp/hsi-corpus-a/corpus.lock.json \
            --out /tmp/hsi-corpus-evolution \
            --max-candidates 4 "Blue Stars"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/hsi-corpus-evolution")
          c=json.loads((p/"hsi_corpus_evolution.hsicert").read_text())
          x=json.loads((p/"hsi_render_policy.json").read_text())
          assert c["status"]=="VERIFIED_PROPOSAL" and c["closed"]==1
          assert c["candidate"]["events"]>c["baseline"]["events"]
          assert c["candidate"]["unique_sources"]>=c["baseline"]["unique_sources"]
          assert c["candidate"]["audio_sha256"]!=c["baseline"]["audio_sha256"]
          assert c["candidate"]["correspondence_residual"]==0
          assert c["proof"]["clxy_step_D1_num"]==0 and c["proof"]["clxy_evolve_D1_num"]==0
          assert c["policy"]==x
          assert c["git_commit_performed"] is False
          PY

      - name: Locked offline rerender
        run: |
          set -eu
          kill "$(cat /tmp/mock-audio.pid)"
          wait "$(cat /tmp/mock-audio.pid)" 2>/dev/null || true
          rm -rf /tmp/hsi-corpus-b
          HSI_OPENVERSE_BASE=http://127.0.0.1:9/v1/audio/ \
          HSI_WIKIMEDIA_COMMONS_BASE=http://127.0.0.1:9/w/api.php \
          HSI_CORPUS_CACHE=/tmp/hsi-corpus-cache \
          HSI_CORPUS_SR=16000 \
          HSI_CORPUS_LOCK=/tmp/hsi-corpus-a/corpus.lock.json \
          HSI_RC_MAX_CANDIDATES=8 \
          HSI_OUT=/tmp/hsi-corpus-b \
          python3 hsi_open_corpus.py "Blue Stars"
          cmp /tmp/hsi-corpus-a/song.wav /tmp/hsi-corpus-b/song.wav
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("/tmp/hsi-corpus-a/song.hsicert").read_text())
          b=json.loads(Path("/tmp/hsi-corpus-b/song.hsicert").read_text())
          assert a["audio_sha256"]==b["audio_sha256"]
          assert b["technical_closed"]==1
          PY

  windows-launcher:
    runs-on: windows-latest
    steps:
      - name: Fetch launcher files without checking out incompatible repository paths
        shell: pwsh
        run: |
          $Ref = "${{ github.event.pull_request.head.sha || github.sha }}"
          $Repo = "${{ github.repository }}"
          $Base = "https://raw.githubusercontent.com/$Repo/$Ref"
          Invoke-WebRequest -Uri "$Base/hsi-corpus.ps1" -OutFile "hsi-corpus.ps1"
          Invoke-WebRequest -Uri "$Base/hsi-corpus.sh" -OutFile "hsi-corpus.sh"
      - name: Verify native PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "hsi-corpus.ps1"),[ref]$tokens,[ref]$errors
          ) | Out-Null
          if($errors.Count -ne 0){$errors|ForEach-Object{Write-Error $_.Message};exit 1}
          $text=Get-Content -Raw "hsi-corpus.ps1"
          if($text -notmatch "hsi_bootstrap.py"){throw "missing immutable bootstrap"}
          if($text -notmatch "HSI_BUNDLE_REF"){throw "missing bundle source reference"}
          if($text -notmatch "corpus"){throw "missing corpus engine"}
          if($text -match "ACE-Step|torch|tensorflow|transformers|diffusion|Suno|Runway|fal.ai"){
            throw "AI/neural dependency found in Windows launcher"
          }
