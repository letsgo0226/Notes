name: Pleiadian Blue — non-AI observation
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'pleiadian_blue/**'
      - '.github/workflows/pleiadian_blue_agent.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: pleiadian-blue-observer
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and test locally without network
        run: |
          python3 -m py_compile pleiadian_blue/agent.py
          python3 pleiadian_blue/agent.py --offline --out "$RUNNER_TEMP/blue-offline"
          python3 -c 'import json,sys; from pathlib import Path; x=json.loads(Path(sys.argv[1]).read_text()); assert not any(x["safety"].values()); assert x["protocol"]=="HSI-PLEIADIAN-BLUE-OBSERVER/1.0"' "$RUNNER_TEMP/blue-offline/receipt.json"
      - name: Observe current GitHub workflow outcomes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 pleiadian_blue/agent.py --out "$RUNNER_TEMP/blue-live"
      - uses: actions/upload-artifact@v4
        with:
          name: pleiadian-blue-review
          path: ${{ runner.temp }}/blue-live/
          retention-days: 7
          if-no-files-found: error
