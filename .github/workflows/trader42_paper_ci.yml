name: Trader_42 paper-only risk gate
on:
  pull_request:
    paths:
      - 'trader42_paper/**'
      - '.github/workflows/trader42_paper_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No-broker paper-only safety tests
        run: |
          python3 -m unittest trader42_paper.test_engine -v
          python3 -m py_compile trader42_paper/engine.py
      - name: Static deny of external broker calls
        run: |
          python3 - <<'PY'
          import ast,pathlib
          p=pathlib.Path('trader42_paper/engine.py')
          tree=ast.parse(p.read_text())
          forbidden={'requests','httpx','urllib','socket','ccxt','binance','subprocess','os','websockets'}
          imports=set()
          for n in ast.walk(tree):
              if isinstance(n,ast.Import):
                  imports.update(x.name.split('.')[0] for x in n.names)
              elif isinstance(n,ast.ImportFrom) and n.module:
                  imports.add(n.module.split('.')[0])
          assert not imports.intersection(forbidden),imports.intersection(forbidden)
          print('NO_BROKER_OR_NETWORK_IMPORTS')
          PY
