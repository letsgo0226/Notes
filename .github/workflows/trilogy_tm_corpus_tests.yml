name: HSI TM Corpus Writer offline tests
on:
  pull_request:
    paths:
      - 'trilogy_tm_corpus.py'
      - 'tests/test_trilogy_tm_corpus.py'
      - '.github/workflows/trilogy_tm_corpus*.yml'
      - 'books/reading-trilogy/open-corpus/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lock audit and real TM replay (no network)
        run: |
          python3 -m py_compile trilogy_tm_corpus.py
          python3 hsi_notes_review.py --json-out "$RUNNER_TEMP/hsi-corpus.json"
          python3 -m unittest discover -s tests -p 'test_trilogy_tm_corpus.py' -v
          python3 trilogy_tm_corpus.py --plan
      - name: Run real TM offline end to end
        run: |
          python3 trilogy_tm_corpus.py --build --offline
          test -s books/reading-trilogy/open-corpus/state.json
      - uses: actions/upload-artifact@v4
        with:
          name: hsi-tm-corpus-offline-sample
          path: books/reading-trilogy/open-corpus/
          retention-days: 14
