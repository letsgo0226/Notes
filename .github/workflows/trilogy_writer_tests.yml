name: Trilogy Writer offline tests
on:
  pull_request:
    paths:
      - 'trilogy_writer.py'
      - 'tests/test_trilogy_writer.py'
      - '.github/workflows/trilogy_writer.yml'
      - '.github/workflows/trilogy_writer_tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run offline tests
        run: |
          python3 -m py_compile trilogy_writer.py
          python3 -m unittest discover -s tests -p 'test_trilogy_writer.py' -v
          python3 trilogy_writer.py --plan
          python3 hsi_notes_review.py --json-out "$RUNNER_TEMP/hsi-notes-review.json"
          python3 -m unittest discover -s tests -v
