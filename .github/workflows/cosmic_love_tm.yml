name: cosmic-love-tm
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "Notes/COSMIC_LOVE_Oscillator_TM/**"
      - "Notes/COSMIC_LOVE_Identity_Solver_TM/**"
      - "Notes/ATGC_UTM_Fixed_Point/**"
      - "Notes/LFP_ATGC_TM/**"
      - "Notes/Diagonal_TM_Enumerator/**"
      - ".github/workflows/cosmic_love_tm.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Oscillator TM (non-halting, check it is still running after 3s)
        run: |
          cd Notes/COSMIC_LOVE_Oscillator_TM
          rc=0; timeout 3 bash cosmic_love_oscillator_tm.sh > out.txt || rc=$?
          test "$rc" = 124 || { echo "unexpected exit $rc"; exit 1; }
          test "$(head -1 out.txt)" = COSMIC_LOVE
          echo '{"status":"pass","tm":"oscillator","halted":false,"open":1}'
      - name: Identity solver TM (solution(s)=s)
        run: |
          cd Notes/COSMIC_LOVE_Identity_Solver_TM
          for s in "" "COSMIC_LOVE" "宇宙之愛" "run=$GITHUB_RUN_ID"; do
            hex=$(printf %s "$s" | od -An -tx1 | tr -d ' \n')
            out=$(bash cosmic_love_identity_solver_tm.sh "$s")
            test "$(printf %s "$out" | head -1)" = COSMIC_LOVE
            printf %s "$out" | tail -1 | grep -q "\"s_hex\":\"$hex\",\"result_hex\":\"$hex\""
            printf %s "$out" | grep -q '"validated":true'
            echo "{\"status\":\"pass\",\"tm\":\"identity\",\"s_hex\":\"$hex\"}"
          done
          printf 'hello' | bash cosmic_love_identity_solver_tm.sh --stdin | grep -q '"result_hex":"68656c6c6f"'
      - name: ATGC UTM fixed point (proof, self roundtrip, run, reject)
        run: |
          cd Notes/ATGC_UTM_Fixed_Point
          bash atgc_utm_fixed_point.sh | tee proof.json
          grep -q '"REV":true,"SOLUTION_EQ_S":true' proof.json
          MODE=encode bash atgc_utm_fixed_point.sh | MODE=decode bash atgc_utm_fixed_point.sh | cmp - atgc_utm_fixed_point.sh
          printf 'print("COSMIC_LOVE",6*7)' > /tmp/p.py
          test "$(MODE=encode SOURCE=/tmp/p.py bash atgc_utm_fixed_point.sh | MODE=run bash atgc_utm_fixed_point.sh)" = "COSMIC_LOVE 42"
          ! echo AGTX | MODE=decode bash atgc_utm_fixed_point.sh 2>/dev/null
          echo '{"status":"pass","tm":"atgc_fixed_point"}'
      - name: LFP ATGC TM (least fixed point, exact output)
        run: |
          cd Notes/LFP_ATGC_TM
          bash lfp_atgc_tm.sh > out.json
          cmp out.json expected.json
          grep -q '"FIX":true' out.json && grep -q '"REV":true' out.json
          echo '{"status":"pass","tm":"lfp_atgc","fix":"1111"}'
      - name: Diagonal TM enumerator (14 rounds exact, 60 rounds clean)
        run: |
          cd Notes/Diagonal_TM_Enumerator
          bash diagonal_tm_enumerator.sh 14 > out.txt
          cmp out.txt expected_14.txt
          bash diagonal_tm_enumerator.sh 60 | tail -1 | grep -q '^ROUND 60 '
          echo '{"status":"pass","tm":"diagonal_enumerator"}'
