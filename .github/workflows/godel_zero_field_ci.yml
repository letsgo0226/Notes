name: Cosmic Love exact Godel zero-field smoke
on:
  pull_request:
    paths:
      - 'godel_zero_field/**'
      - '.github/workflows/godel_zero_field_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-model:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 30 adversarial exact math and API tests
        run: |
          python3 -m unittest discover -s godel_zero_field -t . -v
          python3 -m py_compile godel_zero_field/*.py
      - name: Docker image exact arithmetic smoke
        run: |
          docker build -f godel_zero_field/Dockerfile -t cosmic-godel:ci .
          docker run --rm --entrypoint python cosmic-godel:ci -c "from fractions import Fraction; from godel_zero_field.core import evaluate_integer,decode_rational; r=evaluate_integer(2,0); assert decode_rational(r['F_godel'])==Fraction(2); assert decode_rational(r['E_godel'])==Fraction(4); print('EXACT_GODEL_FIELD_VERIFIED')"
