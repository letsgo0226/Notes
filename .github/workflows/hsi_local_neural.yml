name: hsi_local_neural_archived

on:
  push:
    branches: [main]
    paths:
      - "hsi-neural.sh"
      - "hsi_local_neural.py"
      - "HSI_LOCAL_NEURAL.md"
      - "experimental/neural/**"
      - ".github/workflows/hsi_local_neural.yml"
  workflow_dispatch:

jobs:
  verify-archived:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify active ACE entry is disabled
        run: |
          set -eu
          sh -n hsi-neural.sh
          python3 -m py_compile hsi_local_neural.py
          out="$(sh hsi-neural.sh)"
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'archived and disabled'
          printf '%s' "$out" | grep -q 'hsi-corpus.sh'
          ! grep -Eq 'git clone|ACE-Step-1.5|api_server.py|start_api_server|nohup|127\.0\.0\.1:8001' hsi-neural.sh
          ! grep -Eq 'urllib|ACE-Step|release_task|query_result|127\.0\.0\.1:8001' hsi_local_neural.py
          test -s experimental/neural/hsi-neural.archived.sh
          test -s experimental/neural/hsi_local_neural.archived.py
          test -s experimental/neural/HSI_LOCAL_NEURAL_ARCHIVED.md
          test -s hsi-corpus.sh
