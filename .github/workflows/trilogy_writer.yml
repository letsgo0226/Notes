name: HSI Trilogy Writer
on:
  workflow_dispatch:
    inputs:
      write:
        description: 'Actually draft one section (requires TRILOGY_ENABLED=true)'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
  models: read
concurrency:
  group: hsi-trilogy-writer
  cancel-in-progress: false
jobs:
  writer:
    if: ${{ vars.TRILOGY_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.write) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preflight plan (no API calls)
        run: python3 trilogy_writer.py --plan
      - name: Generate next manuscript part (opt-in only)
        if: ${{ vars.TRILOGY_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.write) }}
        env:
          TRILOGY_ENABLED: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WRITER_API_KEY: ${{ secrets.WRITER_API_KEY }}
          WRITER_API_URL: ${{ vars.WRITER_API_URL }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
        run: python3 trilogy_writer.py --write
      - name: Commit manuscript and state
        if: ${{ vars.TRILOGY_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.write) }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books/reading-trilogy/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: draft next trilogy section'
          git push
