name: HSI Trilogy Writer
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  models: read
concurrency:
  group: hsi-trilogy-writer
  cancel-in-progress: false
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Draft next section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WRITER_API_KEY: ${{ secrets.WRITER_API_KEY }}
          WRITER_API_URL: ${{ vars.WRITER_API_URL }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL }}
        run: python3 trilogy_writer.py
      - name: Save generated drafts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Notes/reading-trilogy/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: draft next trilogy section'
          git push
