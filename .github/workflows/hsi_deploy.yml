name: hsi_deploy

on:
  push:
    branches: [main]
    paths:
      - "hsi_deploy.py"
      - "hsi-deploy.sh"
      - "hsi-deploy.ps1"
      - "hsi_net.py"
      - "HSI_DEPLOY.md"
      - ".github/workflows/hsi_deploy.yml"
  pull_request:
    paths:
      - "hsi_deploy.py"
      - "hsi-deploy.*"
      - "hsi_bundle.lock.json"
      - ".github/workflows/hsi_deploy.yml"
  workflow_dispatch:

jobs:
  verify:
    env:
      HSI_CORE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          set -eu
          sh -n hsi-deploy.sh
          python3 -m py_compile hsi_net.py hsi_deploy.py
          grep -q 'PROTOCOL="HSI-DEPLOY/1.0"' hsi_deploy.py
          grep -q '"github_source"' hsi_net.py

      - name: Private Trader without auth must HOLD
        run: |
          set -eu
          rm -rf /tmp/hsi-auth-hold
          set +e
          env -u GITHUB_TOKEN -u GH_TOKEN \
            python3 hsi_deploy.py --plan --target all --root /tmp/hsi-auth-hold --json >/tmp/hsi-auth-hold.out
          code=$?
          set -e
          cat /tmp/hsi-auth-hold.out
          test "$code" -eq 3
          python3 - <<'PY'
          import json
          c=json.loads(open("/tmp/hsi-auth-hold.out",encoding="utf-8").read().splitlines()[-1])
          assert c["status"]=="HOLD"
          assert c["plan_status"]=="UNRESOLVED"
          assert c["closed"]==0
          assert c["closure"]["committed"] is False
          assert c["invariants"]["private_source_without_auth_never_commits"] is True
          obs=c["net_projection"]["observations"]
          trader=[x for x in obs if x.get("target")=="trader_42"]
          assert trader and trader[0]["status"]=="AUTH_REQUIRED"
          assert c["environment"]["github_auth_available"] is False
          dumped=json.dumps(c)
          assert "Authorization" not in dumped and "Bearer " not in dumped
          PY

      - name: Solve public deployment plan
        run: |
          set -eu
          rm -rf /tmp/hsi-plan
          env -u GITHUB_TOKEN -u GH_TOKEN \
            python3 hsi_deploy.py --plan \
              --target self --target utm --target omega \
              --root /tmp/hsi-plan --json >/tmp/hsi-plan.out
          python3 - <<'PY'
          import json
          c=json.loads(open("/tmp/hsi-plan.out",encoding="utf-8").read().splitlines()[-1])
          assert c["protocol"]=="HSI-DEPLOY/1.0"
          assert c["status"]=="PLAN"
          assert c["plan_status"]=="DEPLOYABLE"
          assert c["closed"]==1
          assert c["closure"]["committed"] is False
          assert c["closure"]["domain_execution_performed"] is False
          assert c["net_projection"]["model"]=="ABSTRACT_GLOBAL_INFORMATION_FIELD"
          assert c["net_projection"]["adapters"]==["github_source"]
          assert c["net_projection"]["global_exhaustion_claim"] is False
          assert c["invariants"]["trader_live_authority"] is False
          assert c["invariants"]["utm_universal_halting_authority"] is False
          assert c["invariants"]["omega_forced_commit_authority"] is False
          PY

      - name: Commit verified public deployment
        run: |
          set -eu
          rm -rf /tmp/hsi-install
          env -u GITHUB_TOKEN -u GH_TOKEN \
            python3 hsi_deploy.py \
              --target self --target utm --target omega \
              --root /tmp/hsi-install --json >/tmp/hsi-deploy.out
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(open("/tmp/hsi-deploy.out",encoding="utf-8").read().splitlines()[-1])
          root=Path("/tmp/hsi-install")
          assert c["status"]=="COMMITTED"
          assert c["closed"]==1
          assert c["closure"]["committed"] is True
          assert c["closure"]["all_targets_verified"] is True
          assert c["closure"]["domain_execution_performed"] is False
          assert c["closure"]["trader_live_armed"] is False
          assert c["closure"]["trader_order_submission"] is False
          assert set(c["targets"])=={"self","utm","omega"}
          for t in c["targets"].values():
              assert t["status"]=="VERIFIED"
              assert len(t["commit"])==40
              assert all(len(x["sha256"])==64 for x in t["files"])
              assert all(len(x["git_blob_sha1"])==40 for x in t["files"])
              assert all(t["checks"].values())
          cur=json.loads((root/"current.json").read_text())
          assert set(cur["targets"])=={"self","utm","omega"}
          assert (root/"hsi.py").exists()
          assert (root/"state"/"deployments").is_dir()
          PY

      - name: Verify installed safe public gates
        run: |
          set -eu
          python3 /tmp/hsi-install/hsi.py net --list-adapters >/tmp/net.out
          grep -q '"github_source"' /tmp/net.out

          python3 /tmp/hsi-install/hsi.py utm "finite computation context" >/tmp/utm.out
          grep -q 'status> UNRESOLVED' /tmp/utm.out
          grep -q 'closed> 1' /tmp/utm.out

          python3 /tmp/hsi-install/hsi.py omega "finite continuation context" >/tmp/omega.out
          grep -q 'status> UNRESOLVED' /tmp/omega.out
          grep -q 'closed> 1' /tmp/omega.out

  windows-launcher:
    runs-on: windows-latest
    steps:
      - name: Fetch launchers at the exact release commit
        shell: pwsh
        run: |
          $Ref="${{ github.event.pull_request.head.sha || github.sha }}"
          $Base="https://raw.githubusercontent.com/${{ github.repository }}/$Ref"
          foreach($Name in @("hsi-deploy.ps1","hsi-native.ps1","hsi-corpus.ps1","hsi_bootstrap.py")){
            Invoke-WebRequest -Uri "$Base/$Name" -OutFile $Name
          }
      - name: Verify PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          foreach($Name in @("hsi-deploy.ps1","hsi-native.ps1","hsi-corpus.ps1")){
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $Name), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if($errors.Count -ne 0){
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
          $text=Get-Content -Raw "hsi-deploy.ps1"
          if($text -notmatch "hsi_bootstrap.py"){throw "missing deploy solver"}
          if($text -notmatch "HSI_BUNDLE_REF"){throw "missing HSI NET bootstrap"}
          if($text -notmatch "gh auth token"){throw "missing ephemeral GitHub auth bridge"}
      - name: Install verified bundle and render actual Native audio on Windows
        shell: pwsh
        run: |
          $env:HSI_BUNDLE_REF="${{ github.event.pull_request.head.sha || github.sha }}"
          $env:HSI_BUNDLE_HOME=Join-Path $env:RUNNER_TEMP "notes-bundle"
          $Output=Join-Path $env:RUNNER_TEMP "notes-native"
          python hsi_bootstrap.py native --sr 8000 --bars 4 --out $Output "prime pulse"
          if($LASTEXITCODE -ne 0){throw "Notes-bound Native render failed"}
          if((Get-Item (Join-Path $Output "song.wav")).Length -le 10000){throw "missing actual audio"}
